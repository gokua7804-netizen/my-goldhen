<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مضيف GoldHEN الخاص بي</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #00adb5; }
        button {
            background-color: #00adb5;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        button:hover { background-color: #007a80; }
        input {
            padding: 10px;
            width: 80%;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background: #252525;
            color: white;
            text-align: center;
        }
        .status {
            margin-top: 20px;
            font-weight: bold;
            color: #ffde7d;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>مُضيف تفعيل GoldHEN الأوفلاين</h1>
    <p>قم بتشغيل ثغرة الـ BinLoader على الـ PS4 أولاً، ثم استخدم هذه الصفحة من الكمبيوتر/الهاتف لإرسال البايلود.</p>
    
    <div id="cache-status" style="color: #393e46; font-size: 14px; margin-bottom: 15px;">جاري فحص حالة الكاش...</div>

    <input type="text" id="ps4ip" placeholder="اكتب عنوان IP جهاز الـ PS4 هنا (مثال: 192.168.1.5)">
    <br>
    <input type="file" id="payloadFile" accept=".bin">
    <br>
    <button onclick="sendPayload()">إرسال بايلود GoldHEN</button>

    <div class="status" id="status-msg">جاهز لإرسال الملف...</div>
</div>

<script>
    // تسجيل نظام الأوفلاين كاش (Service Worker)
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
        .then(() => {
            document.getElementById('cache-status').innerText = "تم حفظ الموقع بنجاح! يمكنك استخدامه بدون إنترنت (Offline).";
            document.getElementById('cache-status').style.color = "#4eed94";
        })
        .catch(err => {
            document.getElementById('cache-status').innerText = "فشل حفظ الكاش تلقائياً.";
            document.getElementById('cache-status').style.color = "#ff6b6b";
        });
    }

    // دالة إرسال البايلود عبر الشبكة إلى منفذ البلايستيشن 9090
    function sendPayload() {
        var ip = document.getElementById('ps4ip').value;
        var fileInput = document.getElementById('payloadFile');
        var status = document.getElementById('status-msg');

        if (!ip) {
            status.innerText = "خطأ: يرجى كتابة الـ IP الخاص بالبلايستيشن أولاً!";
            return;
        }
        if (fileInput.files.length === 0) {
            status.innerText = "خطأ: يرجى اختيار ملف GoldHEN.bin أولاً!";
            return;
        }

        var file = fileInput.files[0];
        var reader = new FileReader();

        status.innerText = "جاري قراءة ملف البايلود...";

        reader.onload = function(e) {
            var buffer = e.target.result;
            status.innerText = "جاري الاتصال بالـ PS4 على منفذ 9090...";

            var xhr = new XMLHttpRequest();
            xhr.open("POST", "http://" + ip + ":9090", true);
            
            xhr.onload = function() {
                status.innerText = "تم إرسال بايلود GoldHEN بنجاح! تحقق من شاشة التلفاز.";
                status.style.color = "#4eed94";
            };
            
            xhr.onerror = function() {
                status.innerText = "فشل الاتصال! تأكد من أن الـ IP صحيح وأنك قمت بتفعيل زر BinLoader على الـ PS4.";
                status.style.color = "#ff6b6b";
            };

            xhr.send(buffer);
        };

        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
